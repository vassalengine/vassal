Error.assistive_technology_not_found_message=<html>Java Access Bridge\ub97c \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc2b5\ub2c8\ub2e4. \uc124\uce58\ud55c \ud654\uba74 \uc77d\uae30 \ud504\ub85c\uadf8\ub7a8\uc774\ub098 \ud654\uba74 \ud655\ub300 \ud504\ub85c\uadf8\ub7a8\uc758 \uc77c\ubd80\ub85c JAB\uac00 \uc798\ubabb \uc124\uce58\ub418\uc5c8\uac70\ub098 \uc758\ub3c4\uce58 \uc54a\uac8c \uc124\uce58\ub418\uc5c8\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \uc0ac\uc6a9\uc790 \ud3f4\ub354\uc5d0 .accessibility.properties \ud30c\uc77c\uc774 \uc788\ub294\uc9c0 \ud655\uc778\ud558\uc138\uc694. \ud574\ub2f9 \uae30\ub2a5\uc744 \uc0ac\uc6a9\ud558\uc9c0 \uc54a\ub294 \uac83\uc774 \ud655\uc2e4\ud558\ub2e4\uba74 \uc774 \ud30c\uc77c\uc744 \uc81c\uac70\ud55c \ub4a4 VASSAL\uc744 \ub2e4\uc2dc \uc2dc\uc791\ud558\uc5ec \ubb38\uc81c\ub97c \ud574\uacb0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ud574\uacb0\ub418\uc9c0 \uc54a\uc73c\uba74 VASSAL \ud3ec\ub7fc\uc758 <a href="https://forum.vassalengine.org/c/technical-support-bugs/6">Technical Support &amp; Bugs</a> \uac8c\uc2dc\ud310\uc5d0 \ub3c4\uc6c0\uc744 \uc694\uccad\ud558\uc138\uc694.</html>

