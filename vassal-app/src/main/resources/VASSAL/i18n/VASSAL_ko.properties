BugDialog.current_version_instructions=<html>\uc624\ub958\uac00 \ubc1c\uc0dd\ud588\uc744 \ub54c \ubb34\uc5c7\uc744 \ud558\uace0 \uc788\uc5c8\ub294\uc9c0 \uc54c\ub824 \uc8fc\uc2dc\uba74 <b>\ubb38\uc81c \ud574\uacb0\uc5d0 \ub3c4\uc6c0\uc774 \ub429\ub2c8\ub2e4.</b> \ucd94\uac00\ub85c \uc9c8\ubb38\ud560 \uc218 \uc788\ub3c4\ub85d <u>\uc5f0\ub77d \ubc29\ubc95\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694.</u> <i>\uc624\ub958\ub97c \ud655\uc2e4\ud558\uac8c \uc7ac\ud604\ud558\ub294 \ub3d9\uc791\uc774\ub098 \uc808\ucc28\ub97c \uc54c\uace0 \uc788\ub2e4\uba74 \uc790\uc138\ud788 \uc124\uba85\ud574 \uc8fc\uc2dc\uba74 \ub354\uc6b1 \ub3c4\uc6c0\uc774 \ub429\ub2c8\ub2e4.</i> VASSAL \uc0ac\uc774\ud2b8\uc5d0\uc11c \ubc1b\uc740 \uac83\uc774 \uc544\ub2cc \ubaa8\ub4c8\uc744 \uc0ac\uc6a9 \uc911\uc774\ub77c\uba74(\uc9c1\uc811 \ub9cc\ub4e4\uac70\ub098 \ub2e4\ub978 \uacf3\uc5d0\uc11c \ubc1b\uc740 \uacbd\uc6b0 \ub4f1), \ud574\ub2f9 \ubaa8\ub4c8\uc744 \uc5b4\ub514\uc11c \uad6c\ud560 \uc218 \uc788\ub294\uc9c0\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694. \uc790\uc138\ud55c \uc815\ubcf4\ub97c \uc8fc\uc2e4\uc218\ub85d \uc624\ub958\ub97c \ub354 \ube60\ub974\uace0 \uc815\ud655\ud558\uac8c \ud574\uacb0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.</html>
