GpIdChecker.refreshByNameFail=\uac8c\uc784 \ub9d0 "%1$s"(GPID %2$s)\uacfc(\uc640) \uc774\ub984\uc774 \uc77c\uce58\ud558\ub294 \uac8c\uc784 \ub9d0\uc744 \ucc3e\uc744 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4
GpIdChecker.SlotNotFound=\uac8c\uc784 \ub9d0 "%1$s"(GPID %2$s)\uc758 \uc2ac\ub86f\uc744 \ucc3e\uc744 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4. \uac31\uc2e0 \uc635\uc158 <i>\uc774\ub984\uc73c\ub85c \uc54c \uc218 \uc5c6\ub294 \uac8c\uc784 \ub9d0 \uc2dd\ubcc4</i>\uc744 \uc0ac\uc6a9\ud574 \ubcf4\uc138\uc694

