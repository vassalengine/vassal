Dialogs.deprecated_code_message=<html><p><b>\uc774 \ubaa8\ub4c8\uc758 "\uc0ac\uc6a9\uc790 \uc815\uc758 \ucf54\ub4dc"\ub294 \uc0ac\uc6a9 \uc911\ub2e8\uc774 \uc608\uace0\ub418\uc5b4 \ud5a5\ud6c4 \ubc84\uc804\uc5d0\uc11c \uc81c\uac70\ub420 \uc218 \uc788\ub294 VASSAL \ud074\ub798\uc2a4, \uba54\uc11c\ub4dc \ub610\ub294 \ud544\ub4dc\ub97c \uc0ac\uc6a9\ud569\ub2c8\ub2e4.</b></p><p><b>\ubaa8\ub4c8 \uc0ac\uc6a9\uc790\ub77c\uba74</b>: \uba3c\uc800 <a href="https://vassalengine.org/wiki/Category:Modules">\ubaa8\ub4c8 \uc790\ub8cc\uc2e4</a>\uc5d0\uc11c \ucd5c\uc2e0 \ubc84\uc804\uc744 \uc0ac\uc6a9 \uc911\uc778\uc9c0 \ud655\uc778\ud558\uc138\uc694. \uc9c0\uae08\uc740 \ubaa8\ub4c8\uc744 \uc2e4\ud589\ud560 \uc218 \uc788\uc9c0\ub9cc, \ubaa8\ub4c8 \uc81c\uc791\uc790\ub098 \uad00\ub9ac\uc790\uc5d0\uac8c \uc0ac\uc6a9\uc790 \uc815\uc758 \ucf54\ub4dc\ub97c \uac31\uc2e0\ud574\uc57c \ud55c\ub2e4\uace0 \uc54c\ub824 \uc8fc\ub294 \uac83\uc774 \uc88b\uc2b5\ub2c8\ub2e4.</p><p><b>\ubaa8\ub4c8 \uc81c\uc791\uc790 \ub610\ub294 \uad00\ub9ac\uc790\ub77c\uba74</b>: \uc544\ub798\uc5d0 \ub098\uc5f4\ub41c \ud074\ub798\uc2a4, \uba54\uc11c\ub4dc \ub610\ub294 \ud544\ub4dc\uac00 \uc81c\uac70\ub418\uae30 \uc804\uc5d0 \uc774\ub97c \uc0ac\uc6a9\ud558\ub294 \ucf54\ub4dc\ub97c \uc218\uc815\ud558\uace0 \ub2e4\uc2dc \ucef4\ud30c\uc77c\ud574\uc57c \ud569\ub2c8\ub2e4. \ub300\uccb4 \ubc29\ubc95\uc740 <a href="https://vassalengine.org/javadoc/">https://vassalengine.org/javadoc/</a>\uc5d0\uc11c \uc0ac\uc6a9 \uc911\ub2e8\uc774 \uc608\uace0\ub41c \ud56d\ubaa9\uc758 Javadoc\uc744 \ud655\uc778\ud558\uc138\uc694. \uc6d0\ub798 \uad00\ub9ac\uc790\uac00 \uc544\ub2c8\uba70 \uc218\uc815 \ubc29\ubc95\uc744 \ubaa8\ub978\ub2e4\uba74 <a href="https://forum.vassalengine.org">httsp://forum.vassalengine.org</a>\uc758 \uae30\uc220 \uc9c0\uc6d0 \ud3ec\ub7fc\uc5d0 \uae00\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694.</p></html>

