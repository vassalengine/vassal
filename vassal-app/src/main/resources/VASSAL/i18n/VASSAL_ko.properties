Bug10900.help_title=\ucc98\ub9ac\ub418\uc9c0 \uc54a\uc740 \uc608\uc678
Bug10900.help_heading=\uc774 \uc624\ub958\ub97c \ud574\uacb0\ud560 \uc218 \uc788\ub3c4\ub85d \ub3c4\uc640\uc8fc\uc138\uc694!
Bug10900.help_message=<html><p>VASSAL\uc774 \uc774\ubbf8\uc9c0 \ud0c0\uc77c\uc744 \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc2b5\ub2c8\ub2e4. \uc774 \ub54c\ubb38\uc5d0 \ud45c\uc2dc\ub418\uc5b4\uc57c \ud560 \uc774\ubbf8\uc9c0\uc758 \uc77c\ubd80 \ub610\ub294 \uc804\uccb4\uac00 \ubcf4\uc774\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.</p><p>\uc774 \ubb38\uc81c\uc5d0 \ub300\ud55c \ubcf4\uace0\uac00 \uc218\ubc31 \uac74 \uc811\uc218\ub418\uc5c8\uc9c0\ub9cc, \ub300\ubd80\ubd84 \uc5f0\ub77d\ucc98\uac00 \uc5c6\uace0 \uc800\ud76c\uac00 \uad6c\ud560 \uc218 \uc5c6\ub294 \ubaa8\ub4c8\uc5d0 \uad00\ud55c \uac83\uc774\uc5b4\uc11c \uc9c1\uc811 \uc7ac\ud604\ud558\uc9c0 \ubabb\ud558\uace0 \uc788\uc2b5\ub2c8\ub2e4. \ubb38\uc81c \ud574\uacb0\uc5d0 \ud611\uc870\ud574 \uc8fc\uc2e4 \ubd84\uc774 \uc5c6\ub2e4\uba74 \uc774 \uc624\ub958\ub97c \uc218\uc815\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.</p><p><b>\uc774 \uc624\ub958\uac00 \ud574\uacb0\ub418\uae30\ub97c \ubc14\ub77c\uc2e0\ub2e4\uba74, \uc5f0\ub77d\ub4dc\ub9b4 \uc218 \uc788\ub3c4\ub85d \uc624\ub958 \ubcf4\uace0\uc11c\uc5d0 \uc774\uba54\uc77c \uc8fc\uc18c\ub97c \ub0a8\uaca8 \uc8fc\uc138\uc694.</b></p></html>

