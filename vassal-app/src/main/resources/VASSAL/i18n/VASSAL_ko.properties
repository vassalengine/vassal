# Names a "Piece Slot" that holds a single piece
GpIdChecker.piece_slot=\uac8c\uc784 \ub9d0 \uc2ac\ub86f %1$s
# Names a Trait within the piece - either a "Place Marker" or a "Replace With Other" Trait.
GpIdChecker.place_replace_trait=\ubc30\uce58/\uad50\uccb4 \ud2b9\uc131 %1$s
# A piece being matched by name having failed to match on slot
GpIdChecker.refreshByName=\uac8c\uc784 \ub9d0 "%1$s"(GPID %2$s)\uc744(\ub97c) \uc774\ub984\uc73c\ub85c \ucc3e\uc544 GPID %3$s\uc758 \uc815\uc758\ub85c \uac31\uc2e0\ud588\uc2b5\ub2c8\ub2e4
