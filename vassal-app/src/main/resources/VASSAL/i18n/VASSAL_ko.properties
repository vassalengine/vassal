Dialogs.removed_code_message=<html><p><b>\uc774 \ubaa8\ub4c8\uc758 "\uc0ac\uc6a9\uc790 \uc815\uc758 \ucf54\ub4dc"\uac00 1\ub144 \uc804\uc5d0 \uc0ac\uc6a9 \uc911\ub2e8\uc774 \uc608\uace0\ub418\uc5b4 \ud604\uc7ac\ub294 \uc81c\uac70\ub41c VASSAL \ud074\ub798\uc2a4, \uba54\uc11c\ub4dc \ub610\ub294 \ud544\ub4dc\ub97c \ucc38\uc870\ud558\ubbc0\ub85c \ubaa8\ub4c8\uc744 \uc5f4 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.</b></p><p><b>\ubaa8\ub4c8 \uc0ac\uc6a9\uc790\ub77c\uba74</b>: \uba3c\uc800 <a href="https://vassalengine.org/wiki/Category:Modules">\ubaa8\ub4c8 \uc790\ub8cc\uc2e4</a>\uc5d0\uc11c \ucd5c\uc2e0 \ubc84\uc804\uc744 \uc0ac\uc6a9 \uc911\uc778\uc9c0 \ud655\uc778\ud558\uc138\uc694. \ucd5c\uc2e0 \ubc84\uc804\uc5d0\uc11c\ub3c4 \uc774 \ubb38\uc81c\uac00 \ubc1c\uc0dd\ud558\uba74 \ubaa8\ub4c8 \uc81c\uc791\uc790\ub098 \uad00\ub9ac\uc790\uc5d0\uac8c \uc0ac\uc6a9\uc790 \uc815\uc758 \ucf54\ub4dc\ub97c \uc218\uc815\ud574 \ub2ec\ub77c\uace0 \uc694\uccad\ud574\uc57c \ud569\ub2c8\ub2e4. \uad00\ub9ac\uc790\uac00 \ub354 \uc774\uc0c1 \ud65c\ub3d9\ud558\uc9c0 \uc54a\uac70\ub098 \uc5f0\ub77d\ud560 \uc218 \uc5c6\ub2e4\uba74 <a href="https://forum.vassalengine.org">https://forum.vassalengine.org</a>\uc758 \uae30\uc220 \uc9c0\uc6d0 \ud3ec\ub7fc\uc5d0 \uae00\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694.</p><p><b>\ubaa8\ub4c8 \uc81c\uc791\uc790 \ub610\ub294 \uad00\ub9ac\uc790\ub77c\uba74</b>: \uc774 \ubaa8\ub4c8\uc744 \uc2e4\ud589\ud558\ub824\uba74 \uc544\ub798\uc5d0 \ub098\uc5f4\ub41c \ud074\ub798\uc2a4, \uba54\uc11c\ub4dc \ub610\ub294 \ud544\ub4dc\ub97c \uc0ac\uc6a9\ud558\ub294 \ucf54\ub4dc\ub97c \uc218\uc815\ud558\uace0 \ub2e4\uc2dc \ucef4\ud30c\uc77c\ud574\uc57c \ud569\ub2c8\ub2e4. \ubaa8\ub4c8\uc5d0\uc11c \ud574\ub2f9 \uc0ac\uc6a9\uc790 \uc815\uc758 \ucf54\ub4dc\ub97c \uc81c\uac70\ud558\ub294 \ubc29\ubc95\ub3c4 \uc788\uc2b5\ub2c8\ub2e4. \ub300\uccb4 \ubc29\ubc95\uc740 <a href="https://vassalengine.org/javadoc/">https://vassalengine.org/javadoc/</a>\uc5d0\uc11c \uc81c\uac70\ub41c \ud56d\ubaa9\uc758 Javadoc\uc744 \ud655\uc778\ud558\uc138\uc694. \uc6d0\ub798 \uad00\ub9ac\uc790\uac00 \uc544\ub2c8\uba70 \uc218\uc815 \ubc29\ubc95\uc744 \ubaa8\ub978\ub2e4\uba74 <a href="https://forum.vassalengine.org">https://forum.vassalengine.org</a>\uc758 \uae30\uc220 \uc9c0\uc6d0 \ud3ec\ub7fc\uc5d0 \uae00\uc744 \ub0a8\uaca8 \uc8fc\uc138\uc694.</p></html>

