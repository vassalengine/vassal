# FIXME: title is wrong for bugs not arriving via the ExceptionHandler
BugDialog.title=Ikke-fanget undtagelse
BugDialog.heading=Hjælp os med at rette denne fejl!
BugDialog.message=<html>VASSAL havde en intern fejl?<i>Du kan hjælpe!</i></html>
BugDialog.collecting_details=VASSAL havde en intern fejl. Vent venligst mens vi indsamler informationer.
BugDialog.current_version_instructions=<html><b>Hjælp os med at rette denne fejl</b> ved at sende os en beskrivelse af, hvad du gjorde, da fejlen opstod, og <u>giv os en måde at kontakte dig på, hvis vi har spørgsmål.</u> <i>Det vil være endnu mere nyttigt, hvis du er har styr på hvilke handlinger eller trin, der pålideligt kan reproducere denne fejl, og hvis du beskrive trinnene i detaljer.</i> Hvis du bruger et modul, som du ikke har fået fra VASSAL siden (f.eks. hvis du selv har lavet det, eller du har hentet det fra et andet sted), så fortæl os, hvordan vi kan få en kopi af modulet. Jo flere information du kan give os, jo mere sandsynligt (og jo hurtigere!) er det, at vi vil være i stand til at rette fejlen.</html>
BugDialog.bug_description=Hvad lavede du, da denne dialogboks dukkede op? Ved du, hvordan du kan få det til at ske igen?
BugDialog.user_email_address=Din e-mailadresse, hvis vi har spørgsmål
BugDialog.send_button=Send
BugDialog.dont_send_button=Send ikke
BugDialog.old_version_instructions=<html>VASSAL havde en intern fejl. Da denne version af VASSAL ikke længere den nyeste, er bug-rapportering deaktiveret. Hvis du kan reproducere denne fejl med den <a href="https://vassalengine.org/download.html">nyeste version</a> af VASSAL, beder vi dig gøre det og gøre os opmærksomme på problemet.</html>
BugDialog.test_version_instructions=<html>VASSAL havde en intern fejl. Fordi denne version af VASSAL er en test version, er bug-rapportering deaktiveret. Hvis du kan reproducere denne fejl med den <a href="https://vassalengine.org/download.html">nyeste version</a> af VASSAL, eller bevidst tester denne version, beder vi dig gøre udviklerne af VASSAL opmærksomme på problemet.</html>
BugDialog.connection_failed_instructions=<html>VASSAL kunne ikke sende din fejlrapport. Indsend filen <a href="%1$s">%2$s</a> og en beskrivelse af, hvad du lavede, da fejlen opstod i sub-forumet <a href="https://forum.vassalengine.org/c/technical-support-bugs/6">Teknisk support & Bugs</a>.</html>
BugDialog.how_to_proceed=På grund af fejlen kan VASSAL være i en inkonsistent tilstand eller opføre sig upålideligt. Vi anbefaler, at du gemmer dine åbne filer under nye navne og genstarter VASSAL.\n\nAfhængigt af hvad fejlen var, kan moduler, gemte spil og logfiler skrevet efter fejlen opstod, være korrupte. Sørg for at kontrollere eventuelle moduler, gemte spil eller logfiler, der er skrevet efter fejlen, før du fortsætter med at bruge dem.
BugDialog.sending_bug_report=Vent venligst, mens vi sender din fejlrapport til bugtrackeren.

TilingMemoryDialog.title=Ikke nok hukommelse til at lave fliser af billeder
TilingMemoryDialog.heading=Vassal løb sandsynligvis tør for hukommelse men fliser af billeder blev lavet
TilingMemoryDialog.message=<html><br/>Dette skyldes sommetider at du har for mange programmer kørende på samme tid.</i></html>
TilingMemoryDialog.bug_description=Hvad var du i gang med, da denne dialogboks dukkede op? Ved du, hvordan man kan få det til at ske igen?
TilingMemoryDialog.collecting_details=VASSAL løb sandsynligvis tør for hukommelse men fliser af billeder blev lavet. Vent venligst, mens vi indsamler informationer.
TilingMemoryDialog.current_version_instructions=<html><b>Hvis du kører mange programmer, så prøv at lukke nogle af dem og prøv igen - eller prøv at genstarte dit system.</b> Hvis problemet gentager sig, så hjælp os ved at sende en beskrivelse af, hvad du gjorde, da fejlen opstod, og <u>giv os en måde at kontakte dig på, hvis vi har spørgsmål.</u> </html>
TilingMemoryDialog.old_version_instructions=<html><b>Hvis du kører mange programmer, så prøv at lukke nogle af dem og prøv igen - eller prøv at genstarte dit system.</b> VASSAL løb tør for hukommelse, mens billeder blev opdelt i fliser. Fordi denne version af VASSAL ikke længere er den nyeste, er fejlrapportering deaktiveret. Hvis du kan genskabe denne fejl med den <a href="https://vassalengine.org/download.html">nyeste version</a> af VASSAL, beder vi dig gøre det og informere os om problemet.</html>
TilingMemoryDialog.test_version_instructions=<html><b>Hvis du kører mange programmer, så prøv at lukke nogle af dem og prøv igen - eller prøv at genstarte dit system.</b> VASSAL løb tør for hukommelse, mens billeder blev opdelt i fliser. Fordi denne version af VASSAL er en testversion, er fejlrapportering deaktiveret. Hvis du kan genskabe denne fejl med den <a href="https://vassalengine.org/download.html">nyeste version</a> af VASSAL eller bevidst tester denne version, beder vi dig om at informere VASSAL-udviklerne om problemet.</html>
TilingMemoryDialog.connection_failed_instructions=<html>VASSAL kunne ikke sende din fejlrapport. Indsend filen <a href="%1$s">%2$s</a> og en beskrivelse af, hvad du gjorde, da fejlen opstod, i sub-forumet <a href="https://forum.vassalengine.org/c/technical-support-bugs/6">Teknisk support og fejl</a>.</html>
TilingMemoryDialog.how_to_proceed=Hvis du kører mange programmer, så prøv at lukke nogle af dem og prøv igen.

ChildProcessDialog.title=Fejl ved start af proces
ChildProcessDialog.heading=Operativsystemet tillod ikke Vassal at starte næste den komponent
ChildProcessDialog.message=<html><br/>De mest almindelige årsager til det, kan være:<br/><br/>(a) Antivirus eller Windows Defender-type programmer blokerer VASSAL i at starte.<br/><br/>(b) For mange programmer kører allerede (operativsystemet er løbet tør for opdelingsplads)<br/><br/>For at få flere idéer om, hvad der forårsagede problemen, kan du tjekke nederst i fejlloggen.</html>
ChildProcessDialog.bug_description=Hvad lavede du, da denne dialogboks dukkede op? Ved du, hvordan man kan genskabe problemet?
ChildProcessDialog.collecting_details=VASSAL løb sandsynligvis tør for hukommelse. Vent venligst mens vi indsamler informationer.
ChildProcessDialog.current_version_instructions=<html><b>Tjek dit antivirus eller Windows Defender for at sikre dig, at de ikke blokerer VASSAL eller Java. Hvis du kører mange programmer, så prøv at lukke nogle af dem og prøv igen, eller prøv en at genstarte dit system.</b> Hvis problemet gentager sig, så hjælp os ved at sende os en beskrivelse af, hvad du lavede, da fejlen opstod, og <u>giv os en måde at kontakte dig på, hvis vi har spørgsmål.</u> </html>
ChildProcessDialog.old_version_instructions=<html><b>Tjek dit antivirus eller Windows Defender for at sikre dig, at de ikke blokerer VASSAL eller Java. Hvis du kører mange programmer, så prøv at lukke nogle af dem og prøv igen, eller prøv at genstart dit system.</b> Fordi denne version af VASSAL ikke længere er den nyeste, er fejlrapportering deaktiveret. Hvis du kan genskabe denne fejl med den <a href="https://vassalengine.org/download.html">nyeste version</a> af VASSAL, så gør det og gør os opmærksomme på problemet.</html>
ChildProcessDialog.test_version_instructions=<html><b>Tjek dit antivirus eller Windows Defender for at sikre dig, at de ikke blokerer VASSAL eller Java. Hvis du kører mange programmer, så prøv at lukke nogle af dem og prøv igen, eller prøv en ren opstart af dit system.</b> Fordi denne version af VASSAL er en testversion, er fejlrapportering deaktiveret. Hvis du kan genskabe denne fejl med den <a href="https://vassalengine.org/download.html">nyeste version</a> af VASSAL eller bevidst tester denne version, så gør VASSAL-udviklerne opmærksomme på problemet.</html>
ChildProcessDialog.connection_failed_instructions=<html>Indsend filen <a href="%1$s">%2$s</a> og en beskrivelse af, hvad du lavede, da fejlen opstod i <a href="https://forum.vassalengine.org/c/technical-support-bugs/6">Teknisk Support & Bugs</a> sub-forument.</html>
ChildProcessDialog.how_to_proceed=Tjek din antivirus eller Windows Defender for at sikre dig, at de ikke blokerer VASSAL eller Java. Hvis du kører mange programmer, så prøv at lukke nogle af dem og prøv igen, eller prøv at genstarte dit system.


