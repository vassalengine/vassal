Chat.joining_room=!<b>Træder ind i rummet: %1$s
# Joined room on server. Leave the | symbol there as it chooses color. <br> is a line break, which can be moved to an appropriate point.
Chat.explain_joined_room=|Du er nu tilsluttet et rum, hvor spillere kan samles og starte eller spille et spil. Hvis nogen allerede har et spil kørende, <br>bør du modtage et billede af kortet (dvs. spillets tilstand) om et øjeblik. Hvis det er nødvendigt, kan du synkronisere manuelt til en spillerens<br> nuværende spiltilstand, <br>ved højreklikke på deres navn og vælge <i>Synkronisé
r</i>. 
# Explains main room on server. Leave | symbol there as it chooses color. <br> are line breaks. <u>, </u>, <i>, and </i> control underline and italics
Chat.explain_main_room=|Når du er i hovedrummet, kan du chatte med andre. Når du er klar til at spille, skal du enten oprette et nyt rum - eller hvis du planlægger at spille med nogen, der allerede har oprettet et rum, skal du dobbeltklikke på deres rum på listen for at trædde ind i det rum. <br><u><i>Spil kan ikke synkroniseres, mens du er i hovedrummet, og hvis du starter et spil, vil det ikke blive sendt til andre spillere.</i></u><br>For at oprette et nyt rum skal du skrive et navn på rummet i boksen Nyt Rum og derefter klikke på Opret. Derefter kan du starte et nyt spil, og andre spillere kan trædde ind i dit rum.
# Leave the ?<b> at the beginning; move the <img...> tag to an appropriate place if need be, but don't change its contents.
Chat.connect_first=?<b>Du skal forbinde til serveren, før du kan oprette et nyt rum. Tryk på <img src="connect.gif"> knappen i server knapperne til højre for at oprette forbindelse til serveren.
# Leave the ?<b> at the beginning; move the <img...> tag to an appropriate place if need be, but don't change its contents.
Chat.connect_first_looking=?<b>Du skal forbinde til serveren, før end du kan finde et spil. Klik på knappen <img src="connect.gif"> i server knapperne til højre for at forbinde til serveren.
# Leave the ?<b> at the beginning.
Chat.name_first=?<b>Navngiv dit nye rum inden du opretter det.
# Leave the !<b> at the beginning. The %1$s goes where it is appropriate to display the name of the new room
Chat.creating_room=!<b>Oprettede og trådte ind i rummet: %1$s
# Leave the | symbol at the beginning. The <br> represents a line break; these can be placed at appropriate point(s).
Chat.explain_created_room=|Du kan nu starte (eller indlæse) et spil, og andre spillere kan træde ind i dit rum. Når et spil er startet, vil spillere, der slutter sig til rummet, automatisk få tilsendt den nuværende spiltilstand. En spiller kan også højreklikke på navnet på en anden spiller, som i øjeblikket har den korrekte spiltilstand, og vælge "Synkroniser" for at få den nuværende spiltilstand. Når alle kan se spillet, er I klar til at spille! Træk vil fremgå samtidigt på alles skærme. 
# Leave the |<b> at the beginning
Chat.sent_sync_request=!<b>Sender synkroniserings anmodning. Vent et øjeblik...
# Leave the ?<b> at the beginning
Chat.sync_too_soon=?<b>For tidligt at sende en ny synkroniseringsanmodning. Vent mindst 15 sekunder, inden du sender en ny anmodning, da det kan tage noget tid at hente spiltilstanden.
# Leave the |<b> at the beginning
Chat.now_looking=!<b>Din status er nu "På udkig efter spil". Andre spillere kan se udråbstegnet og se, at du søger efter et spil. Du kan annullere denne status ved at klikke på knappen igen.
# Leave the |<b> at the beginning
Chat.not_looking=!<b>"På udkig efter spil" status fjernet.
