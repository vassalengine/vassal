Warning.maximum_heap_too_large_title=Værdien af maksimum hukommelse er for stor
Warning.maximum_heap_too_large_heading=Værdien af maksimum hukommelse er for stor
Warning.maximum_heap_too_large_message=Den valgte værdi for maksimale hukommelse i dine præferencer for dette modul er for stor. Bemærk at den maksimale hukommelse skal være mindre end den fysiske RAM i din maskine. Den fjelsikret start-værdi på %1$sMB vil blive brugt istedet. Reducér størrelsen af den maksimale hukommelse i dine præferencer og genstart VASSAL.

Warning.maximum_heap_too_small_title=Værdien af maksimum hukommelse er for lille
Warning.maximum_heap_too_small_heading=Værdien af maksimum hukommelse er for lille
Warning.maximum_heap_too_small_message=Den valgte værdi for maksimale hukommelse i dine præferencer for dette modul er for lille. Den fejlsikret start-værdi på %1$sMB vil blive brugt istedet. Øg værdien af den maksimale hukommelse i dine præferencer og genstart VASSAL.

Warning.initial_heap_too_large_title=Start-værdien af hukommelse er for stor
Warning.initial_heap_too_large_heading=Start-værdien af hukommelse er for stor
Warning.initial_heap_too_large_message=Den valgte start-værdi af hukommelse sat i dine præferencer for dette modul er for stor. Den fejlsikret start-værdi af hukommelse på %1$sMB vil blive brugt istedet. Reducér start-værdien af hukommelse i dine præferencer og genstart VASSAL.

Warning.initial_heap_too_small_title=Start-værdien af hukommelse er for lille
Warning.initial_heap_too_small_heading=Start-værdien af hukommelse er for lille
Warning.initial_heap_too_small_message=Den valgte start-værdi af hukommelse sat i dine præferencer for dette modul er for lille. Den fejlsikret start-værdi af hukommelse på %1$sMB vil blive brugt istedet. Øg start-værdien af hukommelse i dine præferencer og genstart VASSAL.

Error.out_of_memory_title=Løb tør for hukommelse
Error.out_of_memory_heading=Løb tør for hukommelse
Error.out_of_memory_message=VASSAL her løbet tør for hukommelse. Dette modul kræver mere hukommelse end den maksimale hukommelse, du har sat i dine præferencer. Øg den maksimale hukommelse i dine indstillinger og genstart VASSAL.

Error.out_of_memory_reload_title=Løb tør for hukommelse
Error.out_of_memory_reload_heading=Løb tør for hukommelse
Error.out_of_memory_reload_message=VASSAL er løbet tør for hukommelse. Dette modul kræver mere hukommelse end den maksimale hukommelse, du har sat i dine præferencer. VASSAL har fordoblet den maksimale hukommelse i dine indstillinger. Prøv at åbne modulet igen nu, hvor den maksimale hukommelse er blevet forøget.

