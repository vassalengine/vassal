Dialogs.removed_code_title=Inkompatibel bruger kode
Dialogs.removed_code_heading=Inkompatibel bruger kode
Dialogs.removed_code_message=<html><p><b>Dette modul kan ikke åbnes, da den indeholder "bruger kode", der refererer til VASSAL-klasser, metoder eller attributer, som blev annonceret som forældet for mere end et år siden og er siden blevet fjernet.</b></p><p><b>HVIS DU ER EN MODULBRUGER</b>: Tjek først <a href="https://vassalengine.org/library/projects">vores modulbibliotek</a> for at sikre dig, at du bruger den nyeste version af dette modul. Hvis du gør, så kontakt modul designeren/ejeren og få dem til at rette fejlene i deres bruger kode. Hvis modulejeren ikke længere er aktiv eller ikke kan findes, skal du indsende en besked i Technical Support sub-forum på <a href="https://forum.vassalengine.org">https://forum.vassalengine.org</a>.</p><p><b>HVIS DU ER MODULDESIGNER/VEDLIGEHOLDER</b>: For at køre dette modul skal brugen af klasserne, metoderne eller felterne, der er anført nedenfor, erstattes og bruger koden kompiles (muligvis kan bruger koden fjernes fra modulet). Se javadoc for de fjernede elementer på <a href="https://vassalengine.org/javadoc/">https://vassalengine.org/javadoc/</a> for at få råd om, hvordan de kan erstattes. Hvis du ikke er den oprindelige vedligeholder og ikke har kendskab til, hvordan du gør dette, kan du sende en besked i Technical Support sub-forumet på <a href="https://forum.vassalengine.org">https://forum.vassalengine.org</a>.</p></html>

Dialogs.deprecated_code_title=Forældet bruger kode
Dialogs.deprecated_code_heading=Forældet bruger kode
Dialogs.deprecated_code_message=<html><p><b>Dette modul indeholder "bruger kode", der refererer VASSAL-klasser, metoder eller attributer, som er forældede og som risikerer at blive fjernet i en fremtidig version.</b></p><p><b>HVIS DU ER EN MODUL BRUGER</b>: Tjek på <a href="https://vassalengine.org/library/projects">vores modullibrary</a>, du bruger den nyeste version af dette modul. Du kan køre modulet nu.  Giv besked til modul designeren/vedligeholderen om, at deres bruger kode skal opdateres.</p><p><b>HVIS DU ER MODULEDESIGNER / VEDLIGEHOLDER</b>: Brugen af de nedenfor nævnte klasser, metoder eller attributer skal erstattes, og den bruger kode skal genkompileres, før disse klasser, metoder eller felter fjernes. Se javadoc for de forældede elementer på <a href="https://vassalengine.org/javadoc/">https://vassalengine.org/javadoc/</a> for råd om, hvordan man erstatter dem. Hvis du ikke er den oprindelige vedligeholder og ikke har kendskab til, hvordan man gør dette, så send en besked i Technical Support sub-forumet på <a href="https://forum.vassalengine.org">httsp://forum.vassalengine.org</a>.</p></html>

Dialogs.out_of_date=Forældet bruger kode

Dialogs.deprecated.later=en senere dato
Dialogs.deprecated.message=Dette modul indeholder forældet bruger kode, som ikke nødvendigvis virker med nyere versioner af VASSAL, udgivet efter %1$s.
Dialogs.deprecated.detailed_message=Den forældet VASSAL-funktion %1$s blev kaldt fra bruger kode metoden %2$s. Denne VASSAL metode vil muligvis blive fjernet efter %3$s.
Dialogs.check_for_updated_module=Kontroller om der er en opdateret version af modulet. Hvis ikke, så kontakt vedligeholderen af modulet og bed om at det bliver rettet, eller send en besked på Vassal forum og bed om hjælp.
Dialogs.out_dated_usage=Modulet indeholder bruger kode, der kalder ind i VASSAL på en måde, der ikke længere anbefales (%1$s). Det kan resultere i ringere ydelse eller fejl.
Dialogs.incompatible.title=Inkompatibel bruger kode
Dialogs.incompatible.heading=Bruger koden i modulet skal genkompileres
Dialogs.incompatible.message=Modulet indeholder brugerdefineret Java-kode (%1$s), som ikke er blevet kompileret til Java 17. Modulet vil muligvis ikke køre på alle de versioner af Java, som VASSAL understøtter.
Dialogs.module_version_incompatible=Filen er skrevet i en anden version af modulet
Dialogs.module_version_incompatible_sequence=Den fil, du forsøger at indlæse, kan være skrevet af en anden version af modulet, og din version kan derfor ikke finde noget data der er brug for. Hvis du fortsætter med at bruge versionen, er det muligt at fuldstændige spiltilstand ikke er korrekt repræsenteret.
Dialogs.check_for_updated_vmod=Kontrollér, at både din(e) modstander(e) og du, bruger samme version af modulet.

